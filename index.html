<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chismes MX - Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Leaflet Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Librería ligera para fechas relativas (Day.js) -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #e5e7eb; height: 100vh; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Pines */
        .marker-pin {
            width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
            position: absolute; transform: rotate(-45deg);
            left: 50%; top: 50%; margin: -20px 0 0 -20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }

        /* Chat Styles */
        .chat-bg { background-color: #efeae2; background-image: url("https://www.transparenttextures.com/patterns/subtle-white-feathers.png"); }
        .bubble-me { background-color: #dcf8c6; border-radius: 8px 0 8px 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bubble-other { background-color: #ffffff; border-radius: 0 8px 8px 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bubble-original { background-color: #fffbeb; border-left: 4px solid #f59e0b; }

        /* Avatars */
        .avatar-option.selected { border-color: #9333ea; background-color: #f3e8ff; transform: scale(1.1); }
        
        /* Like Animation */
        .like-anim { animation: likeBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes likeBounce { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* Z-Index Layers */
        #side-menu { z-index: 7000; } /* Menú lateral */
        #config-overlay { z-index: 99999; }
        #toast { z-index: 100000; transition: all 0.5s ease; }
        #post-modal, #profile-modal { z-index: 5000; }
        #thread-modal { z-index: 6000; } /* Chat encima de todo */

        /* Scrollbar bonito para la lista */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        
        /* Animación de entrada de lista */
        .list-item-anim { animation: slideInRight 0.3s ease-out; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- ========================================= -->
    <!--            INTERFAZ PRINCIPAL             -->
    <!-- ========================================= -->

    <!-- Header -->
    <div class="absolute top-4 left-4 right-4 z-[1000] flex justify-between items-start pointer-events-none">
        <div class="bg-white/95 backdrop-blur shadow-lg rounded-2xl p-2 pr-4 flex items-center gap-3 pointer-events-auto border border-purple-100">
            <!-- Botón Menú (Hamburguesa) -->
            <button onclick="window.toggleSideMenu()" class="w-10 h-10 hover:bg-gray-100 text-purple-600 rounded-full flex items-center justify-center transition active:scale-95">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <!-- Botón Perfil -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.openProfileModal()">
                <button class="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-500 rounded-full flex items-center justify-center text-white text-lg shadow border-2 border-white">
                    <span id="header-avatar-preview">👻</span>
                </button>
                <div>
                    <h1 class="font-bold text-gray-800 leading-none text-sm">Chismes MX</h1>
                    <p id="app-mode-indicator" class="text-[9px] text-gray-500 font-medium mt-0.5">Cargando...</p>
                </div>
            </div>
        </div>
        
        <button onclick="window.requestLocation()" class="pointer-events-auto bg-white hover:bg-gray-50 text-gray-700 shadow-lg rounded-full w-12 h-12 flex items-center justify-center transition active:scale-95 border border-gray-200">
            <i class="fa-solid fa-location-crosshairs text-xl text-blue-500"></i>
        </button>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Botón Flotante Publicar -->
    <div class="absolute bottom-8 right-6 z-[1000]">
        <button onclick="window.openPostModal()" class="group bg-gray-900 hover:bg-black text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-90 border-4 border-white/20">
            <i class="fa-solid fa-plus text-2xl group-hover:rotate-90 transition-transform duration-300"></i>
        </button>
    </div>

    <!-- ========================================= -->
    <!--            MENÚ LATERAL (LISTA)           -->
    <!-- ========================================= -->
    <div id="side-menu" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col pointer-events-auto">
        <!-- Header del Menú -->
        <div class="p-4 bg-gradient-to-r from-purple-600 to-pink-500 text-white flex justify-between items-center shadow-md z-10">
            <h2 class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-list-ul"></i> Recientes
            </h2>
            <button onclick="window.toggleSideMenu()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        
        <!-- Lista Scrollable -->
        <div id="chismes-list-container" class="flex-1 overflow-y-auto custom-scroll bg-gray-50 p-2 space-y-2">
            <!-- Los items se inyectan aquí con JS -->
            <div class="text-center text-gray-400 mt-10 text-sm italic">
                Cargando chismes...
            </div>
        </div>
        
        <!-- === ESPACIO PUBLICITARIO MENÚ (ADSENSE) === -->
        <div class="p-3 bg-gray-50 border-t border-gray-100">
            <div class="w-full h-24 bg-gray-200 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6958919259026953"
     crossorigin="anonymous"></script>                <i class="fa-solid fa-rectangle-ad text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">ESPACIO PUBLICITARIO</span>
                <span class="text-[9px]">Google AdSense</span>
                <!-- 👆 --------------------------------------------------- 👆 -->
            </div>
        </div>
        
        <!-- Footer del Menú -->
        <div class="p-2 bg-white text-center">
            <p class="text-[10px] text-gray-400">Toca un chisme para ir a su ubicación</p>
        </div>
    </div>
    <!-- Overlay para cerrar menú al tocar fuera -->
    <div id="menu-overlay" onclick="window.toggleSideMenu()" class="fixed inset-0 bg-black/30 z-[6000] hidden transition-opacity opacity-0"></div>

    <!-- ========================================= -->
    <!--            MODAL DE HILO (CHAT)           -->
    <!-- ========================================= -->
    <div id="thread-modal" class="fixed inset-0 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center sm:p-4">
        <div class="bg-white w-full h-full sm:h-[85vh] sm:max-w-md sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative animate-fade-in-up">
            
            <!-- Chat Header -->
            <div class="bg-gray-100 p-4 flex items-center gap-3 border-b border-gray-200 shadow-sm z-10">
                <button onclick="window.closeThread()" class="text-gray-600 hover:bg-gray-200 p-2 rounded-full"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="flex-1">
                    <h3 class="font-bold text-gray-800">Discusión</h3>
                    <p class="text-xs text-green-600" id="thread-status">En línea</p>
                </div>
            </div>

            <!-- Chat Body (Scrollable) -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 chat-bg space-y-4">
                <!-- El Chisme Original (Sticky top visualmente) -->
                <div id="original-post-container" class="mb-6 shadow-md rounded-lg overflow-hidden">
                    <!-- Se llena con JS -->
                </div>
                
                <!-- Lista de Respuestas -->
                <div id="replies-list" class="space-y-3 pb-4">
                    <!-- Se llena con JS -->
                    <p class="text-center text-gray-400 text-xs italic mt-4">Sé el primero en responder...</p>
                </div>
            </div>
            
            <!-- === BANNER PUBLICITARIO CHAT (320x50) === -->
            <div class="bg-gray-100 p-1 flex justify-center border-t border-gray-200">
                <div class="w-[320px] h-[50px] bg-white border border-gray-300 rounded flex items-center justify-center text-gray-400">
                     <!-- 👇 AQUÍ PEGAS TU CÓDIGO DE GOOGLE ADSENSE (Banner Móvil 320x50) 👇 -->
                     <span class="text-[10px]">Publicidad (320x50)</span>
                     <!-- 👆 ----------------------------------------------------------- 👆 -->
                </div>
            </div>

            <!-- Chat Input Footer -->
            <div class="bg-gray-100 p-3 border-t border-gray-200 flex items-center gap-2">
                <input type="text" id="reply-input" class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-3 focus:outline-none focus:border-purple-500 text-sm" placeholder="Escribe una respuesta...">
                <button onclick="window.submitReply()" id="btn-reply" class="bg-purple-600 hover:bg-purple-700 text-white w-12 h-12 rounded-full flex items-center justify-center shadow transition transform active:scale-90">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!--           MODAL PUBLICAR CHISME           -->
    <!-- ========================================= -->
    <div id="post-modal" class="fixed inset-0 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden relative">
            <div class="bg-gradient-to-r from-purple-600 to-pink-500 p-6 text-white flex justify-between items-center">
                <h2 class="font-bold text-xl">Nuevo Chisme</h2>
                <button onclick="window.closePostModal()" class="bg-white/20 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Elige el tono</label>
                <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-hide">
                    <button onclick="window.selectCategory('picante', this)" class="category-btn active bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition ring-red-400">🔥 Picante</button>
                    <button onclick="window.selectCategory('amor', this)" class="category-btn bg-pink-50 border border-pink-200 text-pink-600 px-4 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition ring-pink-400">💘 Amor</button>
                    <button onclick="window.selectCategory('barrio', this)" class="category-btn bg-blue-50 border border-blue-200 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition ring-blue-400">🏘️ Barrio</button>
                </div>
                <textarea id="chisme-content" maxlength="280" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-gray-700 resize-none text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="¿Qué está pasando?"></textarea>
                <div class="mt-2 flex items-center gap-2 text-xs text-gray-500 justify-end">
                    <strong class="text-purple-600" id="posting-as-preview">@Anonimo</strong>
                </div>
                <button onclick="window.submitChisme()" id="btn-submit" class="w-full mt-4 bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center gap-2">Publicar</button>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!--           MODAL PERFIL                    -->
    <!-- ========================================= -->
    <div id="profile-modal" class="fixed inset-0 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden relative">
            <div class="bg-gray-900 p-6 text-white flex justify-between items-center">
                <h2 class="font-bold text-xl">Tu Identidad</h2>
                <button onclick="window.closeProfileModal()" class="bg-white/20 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Sticker</label>
                <div class="grid grid-cols-4 gap-3 mb-6">
                    <div onclick="window.selectAvatar('👻', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">👻</div>
                    <div onclick="window.selectAvatar('👽', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">👽</div>
                    <div onclick="window.selectAvatar('🦊', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">🦊</div>
                    <div onclick="window.selectAvatar('🤡', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">🤡</div>
                    <div onclick="window.selectAvatar('🤠', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">🤠</div>
                    <div onclick="window.selectAvatar('💀', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">💀</div>
                    <div onclick="window.selectAvatar('👀', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">👀</div>
                    <div onclick="window.selectAvatar('🌮', this)" class="avatar-option rounded-xl bg-gray-50 h-14 flex items-center justify-center text-2xl">🌮</div>
                </div>
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Apodo</label>
                <input type="text" id="nickname-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-gray-700 font-bold focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej. ElVengador" maxlength="15">
                <button onclick="window.saveProfile()" class="w-full mt-6 bg-purple-600 text-white font-bold py-3.5 rounded-xl shadow-lg">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 text-sm font-medium opacity-0 pointer-events-none transform -translate-y-4">
        <i id="toast-icon" class="fa-solid fa-info-circle text-blue-400 text-lg"></i> <span id="toast-msg">Mensaje</span>
    </div>

    <!-- ========================================= -->
    <!--            LÓGICA JAVASCRIPT              -->
    <!-- ========================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Fechas (Day.js)
        dayjs.locale('es');
        dayjs.extend(window.dayjs_plugin_relativeTime);

        // -------------------------------------------------------------
        // 👇 TUS LLAVES (MANTENER LAS QUE YA FUNCIONAN) 👇
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBOEBlrI2pw0K3PA0k-ofE7xKDrl39Znyc",
            authDomain: "chismemx-5bb88.firebaseapp.com",
            projectId: "chismemx-5bb88",
            storageBucket: "chismemx-5bb88.firebasestorage.app",
            messagingSenderId: "790491958008",
            appId: "1:790491958008:web:1a5e84de877053bb36490d",
            measurementId: "G-QP2TXX6EGK"
        };

        // Estado Global
        let app, auth, db, map, userLat, userLng;
        let appMode = 'local';
        let currentCategory = 'picante';
        let userProfile = { avatar: '👻', nickname: '@AnonimoMX' };
        let activeThreadId = null; 
        let unsubscribeReplies = null; 
        
        // Estado de Likes y Marcadores
        let likedChismes = new Set(JSON.parse(localStorage.getItem('mx_liked_chismes') || '[]'));
        let markers = {}; 

        // Inicializar
        async function initApp() {
            initMap();
            loadProfileFromStorage();
            
            if (!firebaseConfig.apiKey) {
                appMode = 'local';
                updateModeUI();
                loadLocalChismes();
                window.requestLocation(true);
            } else {
                appMode = 'firebase';
                updateModeUI();
                try {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    await signInAnonymously(auth);
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            loadFirebaseChismes();
                            window.requestLocation(true);
                        }
                    });
                } catch (error) {
                    console.error("Error init:", error);
                    appMode = 'local';
                    loadLocalChismes();
                }
            }
        }

        function updateModeUI() {
            const ind = document.getElementById('app-mode-indicator');
            ind.innerHTML = appMode === 'local' 
                ? '<i class="fa-solid fa-hdd text-orange-500"></i> Modo Local' 
                : '<i class="fa-solid fa-cloud text-green-500"></i> En Línea';
        }

        // --- MENÚ LATERAL ---

        window.toggleSideMenu = function() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            const isOpen = !menu.classList.contains('-translate-x-full');
            
            if (isOpen) {
                menu.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                setTimeout(() => overlay.classList.remove('opacity-100'), 0);
            } else {
                menu.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
                
                // Limpiar mensaje de carga si ya hay items
                const list = document.getElementById('chismes-list-container');
                if (list.children.length > 1) {
                    const loadingMsg = list.querySelector('.text-center.text-gray-400');
                    if (loadingMsg) loadingMsg.style.display = 'none';
                }
            }
        };

        window.flyToChisme = function(id, lat, lng) {
            window.toggleSideMenu(); // Cerrar menú
            
            // Zoom al marcador
            map.flyTo([lat, lng], 17, { duration: 1.5 });
            
            // Abrir popup tras el vuelo
            setTimeout(() => {
                if (markers[id]) markers[id].openPopup();
            }, 1600);
        };

        function addChismeToList(id, data) {
            // Verificar si ya existe en la lista para no duplicar
            if (document.getElementById(`list-item-${id}`)) return;

            const list = document.getElementById('chismes-list-container');
            const loadingMsg = list.querySelector('.text-center.text-gray-400');
            if(loadingMsg) loadingMsg.style.display = 'none';

            const timeAgo = dayjs(data.timestamp).fromNow();
            
            // Colores por categoría para el borde
            const borderColors = { 'picante': 'border-red-500', 'amor': 'border-pink-500', 'barrio': 'border-blue-500' };
            const borderColor = borderColors[data.category] || 'border-gray-500';

            const itemHTML = `
                <div id="list-item-${id}" onclick="window.flyToChisme('${id}', ${data.lat}, ${data.lng})" 
                     class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${borderColor} cursor-pointer hover:bg-gray-50 transition active:scale-95 list-item-anim relative overflow-hidden">
                    
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${data.authorAvatar || '👻'}</span>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-gray-700 truncate">${data.authorNick || '@Anonimo'}</h4>
                                <span class="text-[9px] bg-gray-100 px-1.5 rounded text-gray-500">${data.category}</span>
                            </div>
                            <p class="text-xs text-gray-600 truncate leading-relaxed mt-0.5 font-medium">"${data.text}"</p>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-[10px] text-gray-400">${timeAgo}</span>
                                <div class="flex items-center gap-1 text-[10px] text-pink-500 font-bold">
                                    <i class="fa-solid fa-heart"></i> ${data.likes || 0}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Insertar al PRINCIPIO (prepend) para que los nuevos salgan arriba
            list.insertAdjacentHTML('afterbegin', itemHTML);
        }

        // --- MAPA & MARCADORES ---
        
        function updateOrRenderMarker(id, data) {
            // También agregar a la lista lateral
            addChismeToList(id, data);

            const colors = { 'picante': '#ef4444', 'amor': '#ec4899', 'barrio': '#3b82f6' };
            const c = colors[data.category] || colors.picante;
            const timeAgo = dayjs(data.timestamp).fromNow();
            const isLiked = likedChismes.has(id);
            const likesCount = data.likes || 0;

            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="marker-pin" style="background-color:${c}">
                        <span style="transform: rotate(45deg); font-size: 20px;">${data.authorAvatar || '💬'}</span>
                       </div>`,
                iconSize: [36, 36], iconAnchor: [18, 36]
            });

            // HTML del Popup
            const popupHTML = `
                <div class="p-3 min-w-[240px]">
                    <div class="flex items-center gap-2 mb-2 border-b border-gray-100 pb-2">
                        <span class="text-xl bg-gray-50 rounded-full w-8 h-8 flex items-center justify-center">${data.authorAvatar || '👻'}</span>
                        <div>
                            <p class="text-xs font-bold text-gray-800">${data.authorNick || '@Anonimo'}</p>
                            <p class="text-[9px] uppercase font-bold text-gray-400">${data.category} • ${timeAgo}</p>
                        </div>
                    </div>
                    <p class="text-sm font-medium text-gray-700 leading-snug mb-3 line-clamp-3">"${data.text}"</p>
                    <div class="flex items-center justify-between gap-2">
                        <button id="btn-like-${id}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition bg-gray-50 hover:bg-pink-50 ${isLiked ? 'text-pink-600' : 'text-gray-500'}">
                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart ${isLiked ? 'like-anim' : ''}"></i>
                            <span id="like-count-${id}">${likesCount}</span>
                        </button>
                        <button id="btn-open-${id}" class="flex-1 bg-gray-900 text-white text-xs font-bold py-2 rounded-lg hover:bg-black transition flex items-center justify-center gap-2">
                            <i class="fa-brands fa-whatsapp"></i> Ver / Responder
                        </button>
                    </div>
                </div>
            `;
            
            let marker;
            if (markers[id]) {
                marker = markers[id];
                const oldPopup = marker.getPopup();
                const isOpen = oldPopup && oldPopup.isOpen();
                
                const popupDiv = document.createElement('div');
                popupDiv.innerHTML = popupHTML;
                
                popupDiv.querySelector(`#btn-open-${id}`).onclick = () => window.openThread(id, data);
                popupDiv.querySelector(`#btn-like-${id}`).onclick = (e) => {
                    e.stopPropagation();
                    window.toggleLike(id, data);
                };

                marker.bindPopup(popupDiv);
                if (isOpen) marker.openPopup();
                
                // Actualizar contador en lista si existe
                const listItemLike = document.querySelector(`#list-item-${id} .fa-heart`);
                if(listItemLike && listItemLike.nextSibling) {
                    listItemLike.nextSibling.textContent = " " + likesCount;
                }
                
                if (activeThreadId === id) updateThreadHeaderLikes(id, data);

            } else {
                marker = L.marker([data.lat, data.lng], {icon}).addTo(map);
                markers[id] = marker;

                const popupDiv = document.createElement('div');
                popupDiv.innerHTML = popupHTML;
                popupDiv.querySelector(`#btn-open-${id}`).onclick = () => window.openThread(id, data);
                popupDiv.querySelector(`#btn-like-${id}`).onclick = (e) => { e.stopPropagation(); window.toggleLike(id, data); };
                
                marker.bindPopup(popupDiv);
            }
        }

        // --- LIKES LOGIC ---

        window.toggleLike = async function(id, currentData) {
            const isLiked = likedChismes.has(id);
            const val = isLiked ? -1 : 1;
            
            if (isLiked) likedChismes.delete(id);
            else likedChismes.add(id);
            localStorage.setItem('mx_liked_chismes', JSON.stringify([...likedChismes]));

            if (appMode === 'local') {
                const localData = JSON.parse(localStorage.getItem('mx_chismes_data') || '[]');
                const index = parseInt(id.split('_')[1]);
                if (localData[index]) {
                    localData[index].likes = (localData[index].likes || 0) + val;
                    if (localData[index].likes < 0) localData[index].likes = 0;
                    localStorage.setItem('mx_chismes_data', JSON.stringify(localData));
                    updateOrRenderMarker(id, localData[index]);
                }
            } else {
                const docRef = doc(db, 'chismes', id);
                try {
                    await updateDoc(docRef, { likes: increment(val) });
                } catch(e) { 
                    console.error("Error like:", e);
                    if (isLiked) likedChismes.add(id); else likedChismes.delete(id);
                    localStorage.setItem('mx_liked_chismes', JSON.stringify([...likedChismes]));
                }
            }
        };

        // --- LÓGICA DEL CHAT (HILOS) ---

        window.openThread = function(id, data) {
            activeThreadId = id;
            const modal = document.getElementById('thread-modal');
            const repliesList = document.getElementById('replies-list');
            
            modal.classList.remove('hidden');
            map.closePopup();

            updateThreadHeaderLikes(id, data);

            repliesList.innerHTML = '<div class="flex justify-center p-4"><i class="fa-solid fa-spinner fa-spin text-gray-400"></i></div>';
            
            if (appMode === 'local') loadLocalReplies(id);
            else loadFirebaseReplies(id);
        };

        function updateThreadHeaderLikes(id, data) {
            const originalContainer = document.getElementById('original-post-container');
            if (!originalContainer || activeThreadId !== id) return;

            const timeFull = dayjs(data.timestamp).format('D MMM h:mm A');
            const isLiked = likedChismes.has(id);
            const likesCount = data.likes || 0;

            originalContainer.innerHTML = `
                <div class="bubble-original p-4 relative">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${data.authorAvatar || '👻'}</span>
                            <div>
                                <p class="font-bold text-sm text-gray-900">${data.authorNick || '@Anonimo'}</p>
                                <span class="text-[10px] uppercase font-bold text-white bg-gray-400 px-1.5 py-0.5 rounded">${data.category}</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-gray-800 text-base mb-3 leading-relaxed">${data.text}</p>
                    <div class="flex items-center justify-between border-t border-gray-200/50 pt-2 mt-2">
                        <button onclick="window.toggleLike('${id}')" class="flex items-center gap-1.5 text-xs font-bold transition ${isLiked ? 'text-pink-600' : 'text-gray-500'} hover:text-pink-600">
                             <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-lg ${isLiked ? 'like-anim' : ''}"></i>
                             <span>${likesCount}</span>
                        </button>
                        <p class="text-[10px] text-gray-400">${timeFull}</p>
                    </div>
                </div>
            `;
        }

        window.closeThread = function() {
            document.getElementById('thread-modal').classList.add('hidden');
            activeThreadId = null;
            if (unsubscribeReplies) unsubscribeReplies();
        };

        function loadFirebaseReplies(chismeId) {
            const repliesRef = collection(db, 'chismes', chismeId, 'respuestas');
            const q = query(repliesRef, orderBy('timestamp', 'asc'));

            unsubscribeReplies = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('replies-list');
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p class="text-center text-gray-400 text-xs italic mt-8">Sé el primero en responder...</p>';
                    return;
                }
                snapshot.forEach(doc => renderReplyBubble(doc.data()));
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            });
        }

        function loadLocalReplies(chismeId) {
            const allReplies = JSON.parse(localStorage.getItem('mx_replies_' + chismeId) || '[]');
            const list = document.getElementById('replies-list');
            list.innerHTML = '';
            if (allReplies.length === 0) list.innerHTML = '<p class="text-center text-gray-400 text-xs italic mt-8">Sé el primero en responder...</p>';
            else allReplies.forEach(r => renderReplyBubble(r));
        }

        function renderReplyBubble(data) {
            const list = document.getElementById('replies-list');
            const isMe = data.authorNick === userProfile.nickname;
            const timeShort = dayjs(data.timestamp).format('h:mm A');

            const alignClass = isMe ? 'justify-end pl-8' : 'justify-start pr-8';
            const bubbleClass = isMe ? 'bubble-me' : 'bubble-other';
            const metaClass = isMe ? 'flex-row-reverse' : 'flex-row';

            const html = `
                <div class="flex ${alignClass} mb-2">
                    <div class="${bubbleClass} p-2 px-3 max-w-full min-w-[120px] relative">
                        <div class="flex items-center gap-1 mb-1 ${metaClass} opacity-80">
                            <span class="text-xs">${data.authorAvatar}</span>
                            <span class="text-[10px] font-bold text-gray-600 truncate" style="color: ${stringToColor(data.authorNick)}">${data.authorNick}</span>
                        </div>
                        <p class="text-sm text-gray-800 leading-snug break-words">${data.text}</p>
                        <div class="text-[9px] text-gray-400 text-right mt-1 flex items-center justify-end gap-1">
                            ${timeShort}
                            ${isMe ? '<i class="fa-solid fa-check-double text-blue-400"></i>' : ''}
                        </div>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        window.submitReply = async function() {
            const input = document.getElementById('reply-input');
            const text = input.value.trim();
            if (!text || !activeThreadId) return;

            input.value = '';
            const replyData = {
                text: text,
                authorNick: userProfile.nickname,
                authorAvatar: userProfile.avatar,
                timestamp: new Date().toISOString()
            };

            if (appMode === 'local') {
                const key = 'mx_replies_' + activeThreadId;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                existing.push(replyData);
                localStorage.setItem(key, JSON.stringify(existing));
                loadLocalReplies(activeThreadId);
            } else {
                try {
                    await addDoc(collection(db, 'chismes', activeThreadId, 'respuestas'), replyData);
                } catch (e) {
                    console.error("Error reply:", e);
                    window.showToast("Error al enviar respuesta", "error");
                }
            }
        };

        // --- PUBLICAR CHISME PRINCIPAL ---

        window.submitChisme = async function() {
            const btn = document.getElementById('btn-submit');
            const txt = document.getElementById('chisme-content').value.trim();
            if (!txt) return window.showToast("Escribe algo", "error");
            if (!userLat) { window.requestLocation(); return window.showToast("Falta ubicación", "error"); }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            const offset = 0.003;
            const safeLat = userLat + (Math.random() - 0.5) * offset;
            const safeLng = userLng + (Math.random() - 0.5) * offset;

            const newChisme = {
                text: txt,
                category: currentCategory,
                lat: safeLat, lng: safeLng,
                timestamp: new Date().toISOString(),
                likes: 0,
                authorNick: userProfile.nickname,
                authorAvatar: userProfile.avatar
            };

            try {
                if (appMode === 'local') {
                    const localData = JSON.parse(localStorage.getItem('mx_chismes_data') || '[]');
                    localData.push(newChisme);
                    localStorage.setItem('mx_chismes_data', JSON.stringify(localData));
                    updateOrRenderMarker('local_' + Date.now(), newChisme);
                } else {
                    await addDoc(collection(db, 'chismes'), newChisme);
                }
                window.closePostModal();
                document.getElementById('chisme-content').value = "";
                window.showToast("Publicado", "success");
            } catch (e) {
                window.showToast("Error: " + e.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Publicar";
            }
        };

        // --- CARGAR DATOS ---
        
        function loadLocalChismes() {
            const localData = JSON.parse(localStorage.getItem('mx_chismes_data') || '[]');
            localData.forEach((d, i) => updateOrRenderMarker('local_' + i, d));
        }

        function loadFirebaseChismes() {
            const q = query(collection(db, 'chismes')); 
            onSnapshot(q, (snap) => {
                snap.docChanges().forEach(c => {
                    if (c.type === "added" || c.type === "modified") {
                        updateOrRenderMarker(c.doc.id, c.doc.data());
                    }
                });
            });
        }

        // --- UI UTILS ---

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return '#' + "00000".substring(0, 6 - c.length) + c;
        }

        window.openPostModal = () => document.getElementById('post-modal').classList.remove('hidden');
        window.closePostModal = () => document.getElementById('post-modal').classList.add('hidden');
        
        window.openProfileModal = () => {
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('nickname-input').value = userProfile.nickname.replace('@','');
        };
        window.closeProfileModal = () => document.getElementById('profile-modal').classList.add('hidden');

        window.saveProfile = () => {
            const nick = document.getElementById('nickname-input').value.trim();
            userProfile.nickname = nick ? '@' + nick : '@Anonimo';
            if(window.tempAvatar) userProfile.avatar = window.tempAvatar;
            localStorage.setItem('chismes_profile', JSON.stringify(userProfile));
            document.getElementById('header-avatar-preview').innerText = userProfile.avatar;
            document.getElementById('posting-as-preview').innerText = userProfile.nickname;
            window.closeProfileModal();
        };

        window.selectAvatar = (emoji, el) => {
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            window.tempAvatar = emoji;
        };

        window.selectCategory = (cat, btn) => {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active', 'ring-2'));
            btn.classList.add('active', 'ring-2');
        };

        function loadProfileFromStorage() {
            const s = localStorage.getItem('chismes_profile');
            if(s) {
                userProfile = JSON.parse(s);
                document.getElementById('header-avatar-preview').innerText = userProfile.avatar;
                document.getElementById('posting-as-preview').innerText = userProfile.nickname;
            }
        }

        window.requestLocation = (silent) => {
            if(!navigator.geolocation) return;
            if(!silent) window.showToast("Buscando...", "info");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                    map.flyTo([userLat, userLng], 15);
                    if(!silent) window.showToast("¡Encontrado!", "success");
                },
                () => { if(!silent) window.showToast("Error GPS", "error"); }
            );
        };

        window.showToast = (msg, type) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            const icon = document.getElementById('toast-icon');
            icon.className = type === 'error' ? "fa-solid fa-circle-exclamation text-red-400" : "fa-solid fa-check-circle text-green-400";
            t.classList.remove('opacity-0', '-translate-y-4');
            setTimeout(() => t.classList.add('opacity-0', '-translate-y-4'), 3000);
        };

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
        }

        initApp();
    </script>
</body>
</html>
